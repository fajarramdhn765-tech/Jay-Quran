<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064B32" />
      <stop offset="100%" stop-color="#09251B" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE588" />
      <stop offset="50%" stop-color="#E9B949" />
      <stop offset="100%" stop-color="#C69214" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="108" fill="url(#bg)" />

  <!-- Outer subtle geometric ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#gold)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Islamic 8-pointed star (Rub el Hizb) frame -->
  <g transform="translate(256, 256) scale(0.72) translate(-256, -256)" opacity="0.18">
    <rect x="106" y="106" width="300" height="300" rx="20" fill="none" stroke="url(#gold)" stroke-width="12" />
    <rect x="106" y="106" width="300" height="300" rx="20" fill="none" stroke="url(#gold)" stroke-width="12" transform="rotate(45 256 256)" />
  </g>

  <!-- Crescent and Star at Top -->
  <path d="M 276 135 A 28 28 0 1 0 248 185 A 24 24 0 1 1 276 135 Z" fill="url(#gold)" filter="url(#glow)" />
  <polygon points="266,150 270,160 280,161 272,168 274,178 266,172 258,178 260,168 252,161 262,160" fill="url(#gold)" />

  <!-- Open Quran Book Silhouette -->
  <!-- Left Page -->
  <path d="M 252 235 C 220 220, 160 216, 120 224 C 114 225, 110 230, 110 236 L 110 336 C 110 342, 114 347, 120 346 C 160 338, 220 342, 252 360 Z" fill="#FFF4D6" />
  <path d="M 125 242 C 160 236, 214 238, 244 250 L 244 345 C 214 332, 160 330, 125 336 Z" fill="#FFFFFF" opacity="0.9" />

  <!-- Right Page -->
  <path d="M 260 235 C 292 220, 352 216, 392 224 C 398 225, 402 230, 402 236 L 402 336 C 402 342, 398 347, 392 346 C 352 338, 292 342, 260 360 Z" fill="#FFF4D6" />
  <path d="M 387 242 C 352 236, 298 238, 268 250 L 268 345 C 298 332, 352 330, 387 336 Z" fill="#FFFFFF" opacity="0.9" />

  <!-- Quran Spine / Bookstand (Rihal) -->
  <path d="M 252 235 L 260 235 L 260 364 L 252 364 Z" fill="url(#gold)" />
  
  <!-- Subtle line markings on pages representing holy script -->
  <line x1="140" y1="265" x2="230" y2="265" stroke="#064B32" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  <line x1="145" y1="285" x2="225" y2="285" stroke="#064B32" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  <line x1="140" y1="305" x2="230" y2="305" stroke="#064B32" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  <line x1="150" y1="325" x2="220" y2="325" stroke="#064B32" stroke-width="3" stroke-linecap="round" opacity="0.4" />

  <line x1="282" y1="265" x2="372" y2="265" stroke="#064B32" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  <line x1="287" y1="285" x2="367" y2="285" stroke="#064B32" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  <line x1="282" y1="305" x2="372" y2="305" stroke="#064B32" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  <line x1="292" y1="325" x2="362" y2="325" stroke="#064B32" stroke-width="3" stroke-linecap="round" opacity="0.4" />

  <!-- Wooden Rihal Rehal Stand below -->
  <path d="M 170 350 L 256 390 L 342 350 L 320 366 L 256 400 L 192 366 Z" fill="url(#gold)" />
  <path d="M 210 395 L 170 425 L 185 435 L 235 400 Z" fill="url(#gold)" opacity="0.8" />
  <path d="M 302 395 L 342 425 L 327 435 L 277 400 Z" fill="url(#gold)" opacity="0.8" />

  <!-- Text brandmark at bottom: Jay'z Quran -->
  <text x="256" y="468" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" fill="#FFF4D6" text-anchor="middle" letter-spacing="3">JAY'Z QURAN</text>
</svg>
